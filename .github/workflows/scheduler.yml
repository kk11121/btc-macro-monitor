name: BTC Macro Monitor

on:
  schedule:
    # 毎時0分付近は混むので実行の分をずらす
    - cron: '47 22 * * *'  # 朝のまとめ: 毎日 22:47 UTC（日本時間 7:47）
    - cron: '23 * * * *'   # 毎時の監視: 毎時23分
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'hourly'
        type: choice
        options: [hourly, morning]

permissions:
  contents: write

# state.json を同時に書き換えないよう、実行を1つずつ順番に流す
concurrency:
  group: btc-monitor-state
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUN_MODE: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.mode
        || (github.event.schedule == '47 22 * * *' && 'morning' || 'hourly') }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run monitor
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SOSOVALUE_API_KEY: ${{ secrets.SOSOVALUE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py --mode "$RUN_MODE"
      # 通知に失敗して終了コードが 1 でも、送れた指標の状態は保存する
      - name: Commit updated state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if [ -f history/etf_flows.json ]; then git add history/etf_flows.json; fi
          git diff --staged --quiet || git commit -m "chore: update $RUN_MODE state [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "::error::state の push に3回失敗しました"
          exit 1
